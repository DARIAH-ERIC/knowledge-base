services:
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    container_name: dariah-knowledge-base-imgproxy
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # IMGPROXY_MALLOC: jemalloc
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      # Negotiate the response format from the browser's `Accept` header. The image-variant endpoint
      # redirects rather than proxying, so `Accept` reaches imgproxy directly and this is what picks
      # webp/avif over the source format. Without it every rendition is served as uploaded — which
      # matters most for the hero, the heaviest image on the page and its LCP element.
      IMGPROXY_ENABLE_AVIF_DETECTION: true
      IMGPROXY_ENABLE_WEBP_DETECTION: true
      IMGPROXY_USE_S3: true
      IMGPROXY_ALLOWED_SOURCES: s3://
      IMGPROXY_S3_ENDPOINT: http://minio:${S3_PORT:-9000}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_EC2_METADATA_DISABLED: true
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"

networks:
  default:
    name: dariah-knowledge-base
