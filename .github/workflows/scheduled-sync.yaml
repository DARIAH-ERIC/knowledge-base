name: Scheduled sync

# Starts the admin tasks as background jobs in the knowledge-base app via
# `POST /api/admin-tasks/[kind]`. A green run only means the job was started; its outcome is shown
# on the admin tasks page. Runs are staggered so the website search index sync picks up services
# changed by the SSHOC ingest. Schedules are in UTC, off the full hour, because GitHub delays
# scheduled runs when load is high at the top of the hour.
#
# Scheduled runs always use the workflow file on the default branch (`development`). The `production`
# environment only accepts jobs from `main`, so a scheduled run starts the task on `development`
# directly and dispatches this workflow on `main` for `production`. A manual run must be started from
# the environment's branch. A non-production environment which does not set `DEPLOY_ENVIRONMENT`
# (and would fall back to repository-level values) is skipped.

on:
  schedule:
    - cron: "26 2 * * *"
    - cron: "26 3 * * *"
    - cron: "26 4 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Admin task to start"
        required: true
        type: choice
        options:
          - ingest_sshoc_services
          - sync_resources_search_index
          - sync_website_search_index
      environment:
        description: "Environment to start the admin task on"
        required: true
        type: choice
        options:
          - production
          - development

env:
  KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind ||
    github.event.schedule == '26 2 * * *' && 'ingest_sshoc_services' ||
    github.event.schedule == '26 3 * * *' && 'sync_resources_search_index' ||
    github.event.schedule == '26 4 * * *' && 'sync_website_search_index' || '' }}

jobs:
  dispatch-production:
    name: Dispatch admin task / production
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -eu
          test -n "$KIND"
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref main \
            --field kind="$KIND" --field environment=production

  trigger:
    name: Start admin task / ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["development"]') }}

    environment:
      name: ${{ matrix.environment }}
      deployment: false

    steps:
      - name: Start admin task
        env:
          BASE_URL: "${{ vars.NEXT_PUBLIC_APP_BASE_URL }}"
          SECRET: "${{ secrets.K8S_SECRET_BACKGROUND_JOBS_API_SECRET }}"
        run: |
          set -eu
          test -n "$KIND"
          if [ "${{ vars.DEPLOY_ENVIRONMENT }}" != "${{ matrix.environment }}" ]; then
            if [ "${{ matrix.environment }}" = "production" ]; then
              echo "::error::The production environment must set the DEPLOY_ENVIRONMENT variable."
              exit 1
            fi
            echo "::notice::${{ matrix.environment }} is not configured, skipping."
            exit 0
          fi
          status=$(
            curl --silent --show-error --output response.json --write-out "%{http_code}" \
              --retry 3 --retry-all-errors --retry-delay 10 \
              --request POST \
              --header "Authorization: Bearer ${SECRET}" \
              --header "Origin: ${BASE_URL}" \
              "${BASE_URL}/api/admin-tasks/${KIND}"
          )
          cat response.json
          echo
          case "$status" in
            202) echo "Started ${KIND}." ;;
            409) echo "::warning::${KIND} is already running." ;;
            *) echo "::error::Failed to start ${KIND} (HTTP ${status})."; exit 1 ;;
          esac
