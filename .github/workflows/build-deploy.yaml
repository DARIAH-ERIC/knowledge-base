name: Build and deploy

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-build-deploy"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

on:
  workflow_call:
  workflow_dispatch:

jobs:
  config:
    name: Detect changed apps
    runs-on: ubuntu-24.04

    # `main` deploys to production, everything else to the development instance. The environment
    # supplies the variables and secrets; `deployment: false` reads them without recording a
    # deployment, which only the deploy job does.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false

    env:
      DEPLOY_ENVIRONMENT: "${{ github.ref_name == 'main' && 'production' || 'development' }}"
      TURBO_TEAM: "${{ vars.TURBO_TEAM }}"
      TURBO_TOKEN: "${{ secrets.TURBO_TOKEN }}"

    outputs:
      environment: ${{ env.DEPLOY_ENVIRONMENT }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      repository: ${{ steps.repository.outputs.repository }}
      turbo_version: ${{ steps.turbo.outputs.turbo_version }}
      pnpm_version: ${{ steps.pnpm.outputs.pnpm_version }}

    steps:
      # Variables and secrets fall back to repository-level values when the environment does not
      # define them, which would deploy with another environment's configuration (e.g. production's
      # kubernetes namespace). Each environment therefore has to declare its own name.
      - name: Check environment configuration
        run: |
          if [ "${{ vars.DEPLOY_ENVIRONMENT }}" != "${DEPLOY_ENVIRONMENT}" ]; then
            echo "::error::The ${DEPLOY_ENVIRONMENT} environment must set the DEPLOY_ENVIRONMENT variable to \"${DEPLOY_ENVIRONMENT}\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: "blob:none"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set lowercase repository name
        id: repository
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >>
          $GITHUB_OUTPUT

      - name: Resolve turbo version
        id: turbo
        # Read the turbo version resolved in the lockfile catalog so the Dockerfile's pre-install
        # `turbo prune` uses the same version as the repo (passed via the TURBO_VERSION build arg).
        run:
          echo "turbo_version=$(awk '/^catalogs:/{c=1} c&&/^    turbo:/{t=1} t&&/version:/{print $2; exit}' pnpm-lock.yaml)" >>
          $GITHUB_OUTPUT

      - name: Resolve pnpm version
        id: pnpm
        # Read the pnpm version pinned in `package.json` so the Dockerfile installs the same version
        # as the repo (passed via the PNPM_VERSION build arg). `devEngines.packageManager` (an
        # object or an array of them) takes precedence over the `packageManager` field.
        run: |
          pnpm_version="$(jq -r '
            ([.devEngines.packageManager // empty] | flatten | map(select(.name == "pnpm"))[0].version)
            // (.packageManager | split("@")[1] | split("+")[0])
          ' package.json)"
          echo "pnpm_version=${pnpm_version}" >> $GITHUB_OUTPUT

      - name: Detect affected apps
        id: changes
        env:
          # @see {@link https://github.com/vercel/turborepo/issues/9320#issuecomment-2499219314}
          TURBO_SCM_BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
          ALL_APPS: |
            [
              {
                "name": "knowledge-base",
                "image": "app",
                "environment": "${{ env.DEPLOY_ENVIRONMENT }}",
                "public_url": "${{ vars.NEXT_PUBLIC_APP_BASE_URL }}",
                "service_id": "${{ vars.APP_SERVICE_ID }}"
              },
              {
                "name": "api",
                "image": "api",
                "environment": "${{ env.DEPLOY_ENVIRONMENT }}",
                "public_url": "${{ vars.K8S_SECRET_API_BASE_URL }}",
                "service_id": "${{ vars.API_SERVICE_ID }}"
              }
            ]
        run: |
          set -eux
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX=$(echo "$ALL_APPS" | jq -c '.')
          else
            AFFECTED=$(
              pnpm dlx turbo ls --affected --output json \
              2>/dev/null || echo '{"packages":{"items":[]}}'
            )
            NAMES=$(echo "$AFFECTED" | jq -c '[.packages.items[] | select(.path | startswith("apps/")) | .name | sub("^@dariah-eric/"; "")]')
            MATRIX=$(echo "$ALL_APPS" | jq -c --argjson names "$NAMES" '[.[] | select(.name as $n | $names | index($n))]')
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push docker images
    needs: [config]
    if: needs.config.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # `NEXT_PUBLIC_` variables are inlined at build time, so images are built per environment.
    environment:
      name: ${{ needs.config.outputs.environment }}
      deployment: false

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.config.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Extract metadata (tags, labels) for docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "ghcr.io/${{ needs.config.outputs.repository }}-${{ matrix.target.image }}"
          tags: |
            type=raw,value={{sha}}
            type=ref,event=branch

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: "${{ matrix.target.image }}"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            "PNPM_VERSION=${{ needs.config.outputs.pnpm_version }}"
            "TURBO_VERSION=${{ needs.config.outputs.turbo_version }}"
            "NEXT_PUBLIC_APP_BASE_URL=${{ vars.NEXT_PUBLIC_APP_BASE_URL }}"
            "NEXT_PUBLIC_APP_BOTS=disabled"
            "NEXT_PUBLIC_APP_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_APP_GOOGLE_SITE_VERIFICATION }}"
            "NEXT_PUBLIC_APP_IMPRINT_CUSTOM_CONFIG=disabled"
            "NEXT_PUBLIC_APP_IMPRINT_SERVICE_BASE_URL=${{ vars.NEXT_PUBLIC_IMPRINT_SERVICE_BASE_URL }}"
            "NEXT_PUBLIC_APP_MATOMO_BASE_URL=${{ vars.NEXT_PUBLIC_MATOMO_BASE_URL }}"
            "NEXT_PUBLIC_APP_MATOMO_ID=${{ vars.NEXT_PUBLIC_APP_MATOMO_ID }}"
            "NEXT_PUBLIC_APP_SENTRY_DSN=${{ vars.NEXT_PUBLIC_APP_SENTRY_DSN }}"
            "NEXT_PUBLIC_APP_SENTRY_ORG=${{ vars.NEXT_PUBLIC_SENTRY_ORG }}"
            "NEXT_PUBLIC_APP_SENTRY_DATA_COLLECTION=${{ vars.NEXT_PUBLIC_APP_SENTRY_DATA_COLLECTION }}"
            "NEXT_PUBLIC_APP_SENTRY_PROJECT=${{ vars.NEXT_PUBLIC_APP_SENTRY_PROJECT }}"
            "NEXT_PUBLIC_APP_SERVICE_ID=${{ vars.APP_SERVICE_ID }}"
            "NEXT_PUBLIC_TYPESENSE_HOST=${{ vars.NEXT_PUBLIC_TYPESENSE_HOST }}"
            "NEXT_PUBLIC_TYPESENSE_PORT=${{ vars.NEXT_PUBLIC_TYPESENSE_PORT }}"
            "NEXT_PUBLIC_TYPESENSE_PROTOCOL=${{ vars.NEXT_PUBLIC_TYPESENSE_PROTOCOL }}"
            "NEXT_PUBLIC_TYPESENSE_RESOURCE_COLLECTION_NAME=${{ vars.NEXT_PUBLIC_TYPESENSE_RESOURCE_COLLECTION_NAME }}"
            "NEXT_PUBLIC_TYPESENSE_WEBSITE_COLLECTION_NAME=${{ vars.NEXT_PUBLIC_TYPESENSE_WEBSITE_COLLECTION_NAME }}"
            "NEXT_PUBLIC_TYPESENSE_SEARCH_API_KEY=${{ secrets.K8S_SECRET_TYPESENSE_SEARCH_API_KEY }}"
          secrets: |
            "TURBO_TEAM=${{ vars.TURBO_TEAM }}"
            "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}"
          cache-from: type=gha,scope=${{ matrix.target.image }}-${{ matrix.target.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.image }}-${{ matrix.target.environment }}

  build-migrate:
    name: Build and push docker images
    needs: [config]
    if: needs.config.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Extract metadata (tags, labels) for migrate docker image
        id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: "ghcr.io/${{ needs.config.outputs.repository }}-migrate"
          tags: |
            type=raw,value={{sha}}
            type=ref,event=branch

      - name: Build and push migrate docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: "${{ steps.meta-migrate.outputs.tags }}"
          labels: "${{ steps.meta-migrate.outputs.labels }}"
          build-args: |
            "PNPM_VERSION=${{ needs.config.outputs.pnpm_version }}"
            "TURBO_VERSION=${{ needs.config.outputs.turbo_version }}"
          secrets: |
            "TURBO_TEAM=${{ vars.TURBO_TEAM }}"
            "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}"
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    name: Deploy docker images
    needs: [config, build, build-migrate]
    if: needs.config.outputs.has_changes == 'true'
    uses: dariah-eric/gl-autodevops-minimal-port/.github/workflows/deploy.yml@main
    secrets: inherit

    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.config.outputs.matrix) }}
      max-parallel: 1

    with:
      default_port: "3000"
      environment: "${{ matrix.target.environment }}"
      APP_NAME: "${{ matrix.target.image }}"
      APP_ROOT: "/"
      DOCKER_TAG: "ghcr.io/${{ needs.config.outputs.repository }}-${{ matrix.target.image }}"
      PUBLIC_URL: "${{ matrix.target.public_url }}"
      SERVICE_ID: "${{ matrix.target.service_id }}"
