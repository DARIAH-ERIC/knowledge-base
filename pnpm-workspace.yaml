catalogMode: strict

cleanupUnusedCatalogs: true

engineStrict: true

minimumReleaseAge: 720

patchedDependencies:
  next: patches/next.patch

# Hoisted for the module hooks of the OpenTelemetry instrumentations, which must resolve these packages
# from the app's runtime.
# @see {@link https://docs.sentry.io/platforms/javascript/guides/node/troubleshooting/#pnpm-resolving-import-in-the-middle-external-package-errors}
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'

shellEmulator: true
